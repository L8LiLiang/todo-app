<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-app">
    <div class="todo-header">
      <div>
        <h1>Todo List</h1>
        <p class="intro">Capture your tasks with calm focus. Add, complete, and clear items in a crisp modern workspace.</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light theme">🌙</button>
    </div>
    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new todo" aria-label="Add a new todo">
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list" class="todo-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
